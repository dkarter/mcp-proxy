name: GoReleaser

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject duplicate release attempts
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::A release already exists for this tag. Use a new signed tag.'
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Go
        uses: actions/setup-go@v7.0.0 # Verified immutable release tag.
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install Cosign
        run: go install github.com/sigstore/cosign/v3/cmd/cosign@v3.1.4
        env:
          GOTOOLCHAIN: auto
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0 # Verified immutable release tag.
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives
        uses: actions/attest@v4.2.2 # Verified immutable release tag.
        with:
          subject-checksums: ./dist/checksums.txt
      - name: Verify signature and publish release
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/goreleaser.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
